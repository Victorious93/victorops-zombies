name: Android CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing keystore (if secret present)
        env:
          VOZ_KEYSTORE_B64: ${{ secrets.VOZ_KEYSTORE_B64 }}
        run: |
          if [ -n "${VOZ_KEYSTORE_B64}" ]; then
            echo "$VOZ_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/voz.jks"
            echo "VOZ_KEYSTORE_PATH=$RUNNER_TEMP/voz.jks" >> "$GITHUB_ENV"
          else
            echo "No keystore secret; using default debug key"
          fi
      - name: Unit tests
        run: ./gradlew test --no-daemon
      - name: Assemble debug APK
        env:
          VOZ_KEYSTORE_PASSWORD: ${{ secrets.VOZ_KEYSTORE_PASSWORD }}
          VOZ_KEY_ALIAS: ${{ secrets.VOZ_KEY_ALIAS }}
          VOZ_KEY_PASSWORD: ${{ secrets.VOZ_KEY_PASSWORD }}
        run: ./gradlew :android:assembleDebug --no-daemon
      - name: Verify APK signature and ABIs
        run: |
          set -euo pipefail
          APK=android/build/outputs/apk/debug/android-debug.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | grep -v -i password | tee verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" verify.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" verify.txt
          unzip -l "$APK" | tee contents.txt | grep "lib/"
          grep -q "lib/arm64-v8a/libgdx.so" contents.txt
          grep -q "lib/armeabi-v7a/libgdx.so" contents.txt
          "$BT/aapt2" dump badging "$APK" | grep -E "package:|targetSdkVersion"
      - uses: actions/upload-artifact@v4
        with:
          name: victorops-zombies-debug-apk
          path: android/build/outputs/apk/debug/android-debug.apk
